# Reusable workflow: sync-from-public — scheduled/dispatch mirror of a PUBLIC upstream
# into a private/staging repo. The resolve-config job maps ${{ github.repository }} to its
# upstream repo and the branches to mirror; unlisted callers fall back to safe defaults
# (see resolve-config) rather than syncing an unknown source.
#
# The merge excludes .github/workflows/, so each private repo retains its reviewed workflows.
# The only repo-specific divergence is the upstream target and which branches to sync (the
# CLI repo also mirrors `preview` in addition to `main`).
#
# Scope: this covers public-upstream sync ONLY. Internal branch promotion (e.g. main -> preview
# with version/schema/CHANGELOG preservation) is a separate concern and is intentionally not
# folded in here.

name: Reusable - Sync From Public

# caller-on:
#   schedule:
#   - cron: 0 */6 * * *
#   workflow_dispatch: null

on:
  workflow_call:
    # No inputs: repo-specific values are derived from ${{ github.repository }} (resolve-config).
    # Secrets/vars are inherited from the caller via `secrets: inherit`.

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # Map the calling repository to its repo-specific sync configuration. The ONLY per-repo
  # divergence is the upstream target and the branches to mirror.
  resolve-config:
    runs-on: ubuntu-latest
    outputs:
      upstream_repo: ${{ steps.cfg.outputs.upstream_repo }}
      branches: ${{ steps.cfg.outputs.branches }}
    steps:
      - name: Fetch secrets from Secrets Manager
        uses: aws/agentcore-devx-devtools/.github/actions/fetch-secrets@31aa3b031a86664e29861d68956e44b07cf21a74
        with:
          role-arn: ${{ secrets.WORKFLOW_SECRETS_READER_ROLE_ARN }}
          shared: CLI_PRIVATE_REPO_NAME SDK_PYTHON_PRIVATE_REPO_NAME SDK_TS_PRIVATE_REPO_NAME
      - name: Resolve repo-specific config
        id: cfg
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$REPO" in
            "$SDK_PYTHON_PRIVATE_REPO_NAME")
              upstream_repo="aws/bedrock-agentcore-sdk-python"
              branches="main"
              ;;
            "$CLI_PRIVATE_REPO_NAME")
              upstream_repo="aws/agentcore-cli"
              branches="main preview"
              ;;
            "$SDK_TS_PRIVATE_REPO_NAME")
              upstream_repo="aws/bedrock-agentcore-sdk-typescript"
              branches="main"
              ;;
            *)
              # Safe default: derive upstream by stripping common private/staging affixes and
              # sync only main. Fail safe for unknown callers.
              echo "::warning::Unrecognized caller repository '$REPO'. Falling back to safe defaults."
              name="${REPO#*/}"
              name="${name#private-}"
              name="${name%-private}"
              name="${name%-staging}"
              upstream_repo="aws/${name}"
              branches="main"
              ;;
          esac
          echo "upstream_repo=$upstream_repo" >> "$GITHUB_OUTPUT"
          echo "branches=$branches" >> "$GITHUB_OUTPUT"
          echo "Resolved config for $REPO:"
          echo "  upstream_repo = $upstream_repo"
          echo "  branches      = $branches"

  # Sync each configured branch from the public upstream into this private repo.
  sync:
    needs: resolve-config
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add public remote
        env:
          UPSTREAM_REPO: ${{ needs.resolve-config.outputs.upstream_repo }}
        run: |
          set -euo pipefail
          git remote add public "https://github.com/${UPSTREAM_REPO}.git"

      - name: Sync branches with public upstream
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UPSTREAM_REPO: ${{ needs.resolve-config.outputs.upstream_repo }}
          BRANCHES: ${{ needs.resolve-config.outputs.branches }}
        run: |
          set -uo pipefail

          UPSTREAM_URL="https://github.com/${UPSTREAM_REPO}"

          # Push the already-committed sync merge at HEAD to a new branch and open a PR into <branch>.
          open_sync_pr() {
            local branch="$1"

            local existing_pr
            existing_pr=$(gh pr list --base "$branch" --state open --json number,headRefName \
              --jq "[.[] | select(.headRefName | startswith(\"sync-${branch}-\"))][0].number // empty" 2>/dev/null || echo "")

            if [ -n "$existing_pr" ]; then
              echo "ℹ️  Sync PR #$existing_pr already exists, skipping"
              return 0
            fi

            local pr_branch
            pr_branch="sync-${branch}-$(date +%Y%m%d-%H%M%S)"
            if ! git push origin "HEAD:refs/heads/$pr_branch"; then
              echo "::error::Failed to push $pr_branch"
              return 1
            fi

            if ! gh pr create \
              --title "chore: sync $branch with public/$branch" \
              --body "## Automated Sync

          This PR was automatically created because \`public/$branch\` merged cleanly into \`$branch\`, but pushing directly to \`$branch\` was rejected (for example, by a rule requiring pull requests).

          **Source:** \`$branch\` from [${UPSTREAM_REPO}](${UPSTREAM_URL})
          **Target:** \`$branch\`

          No conflicts. Review and merge this PR to complete the sync." \
              --base "$branch" \
              --head "$pr_branch"; then
              echo "::error::Failed to create sync PR for $branch"
              return 1
            fi

            echo "✅ Opened sync PR for $branch"
            return 0
          }

          sync_branch() {
            local branch="$1"

            echo "=============================================="
            echo "Syncing branch: $branch  (from ${UPSTREAM_REPO})"
            echo "=============================================="

            # Only sync branches that exist on BOTH the public upstream and our origin.
            if ! git ls-remote --exit-code --heads public "$branch" >/dev/null 2>&1; then
              echo "ℹ️  Upstream has no '$branch' branch, skipping"
              return 0
            fi
            if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "ℹ️  Origin has no '$branch' branch, skipping"
              return 0
            fi

            git fetch public "$branch"
            git fetch origin "$branch"

            # Check out the target branch, tracking origin, and hard-reset to origin state.
            if git show-ref --verify --quiet "refs/heads/$branch"; then
              git checkout "$branch"
            else
              git checkout --track "origin/$branch"
            fi
            git reset --hard "origin/$branch"

            # Check if public/<branch> is already merged
            if git merge-base --is-ancestor "public/$branch" HEAD; then
              echo "✅ $branch is already up to date with public/$branch"
              return 0
            fi

            # Merge source changes while retaining the private repo's reviewed workflows.
            if git merge "public/$branch" --no-commit --no-ff; then
              git restore --source=HEAD --staged --worktree -- .github/workflows/
              git commit -m "chore: sync $branch with public/$branch"
              if git push origin "$branch"; then
                echo "✅ $branch synced successfully"
                return 0
              fi

              # Direct pushes are rejected when the branch requires pull requests; open one instead.
              echo "ℹ️  Push to $branch was rejected, opening a sync PR instead"
              open_sync_pr "$branch"
              return $?
            fi

            echo "⚠️  Conflict detected in $branch"

            # Capture conflicted files before aborting
            local conflicted_files
            conflicted_files=$(git diff --name-only --diff-filter=U 2>/dev/null || echo "Unable to determine conflicted files")
            git merge --abort

            # Check if a sync PR already exists for this branch
            local existing_pr
            existing_pr=$(gh pr list --base "$branch" --state open --json number,headRefName \
              --jq "[.[] | select(.headRefName | startswith(\"sync-conflict-${branch}-\"))][0].number" 2>/dev/null || echo "")

            if [ -n "$existing_pr" ]; then
              echo "ℹ️  PR #$existing_pr already exists, skipping"
              return 0
            fi

            local conflict_branch="sync-conflict-${branch}-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$conflict_branch"

            git merge "public/$branch" --no-commit --no-ff || true
            git restore --source=HEAD --staged --worktree -- .github/workflows/
            git add -A
            git commit -m "chore: sync $branch with public/$branch (conflicts present)

          This automated sync detected merge conflicts that require manual resolution.

          Source: public/$branch ($UPSTREAM_URL)
          Target: $branch

          Please resolve conflicts and merge this PR." || true

            git push origin "$conflict_branch"

            gh pr create \
              --title "🔀 [Sync Conflict] Merge public/$branch → $branch" \
              --body "## Automated Sync Conflict

          This PR was automatically created because merging \`public/$branch\` into \`$branch\` encountered conflicts.

          **Source:** \`$branch\` from [${UPSTREAM_REPO}](${UPSTREAM_URL})
          **Target:** \`$branch\`

          ### Action Required
          1. \`git fetch origin && git checkout $conflict_branch\`
          2. Resolve merge conflicts
          3. \`git add . && git commit\`
          4. \`git push origin $conflict_branch\`
          5. Merge this PR

          ### Files with Conflicts
          \`\`\`
          $conflicted_files
          \`\`\`" \
              --base "$branch" \
              --head "$conflict_branch" || echo "⚠️  Failed to create PR"
          }

          overall_rc=0
          for b in $BRANCHES; do
            if ! sync_branch "$b"; then
              echo "::error::Failed while syncing branch '$b'"
              overall_rc=1
            fi
          done
          exit "$overall_rc"
