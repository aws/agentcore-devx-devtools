name: Workflow Metrics

on:
  workflow_call:
    inputs:
      namespace:
        description: CloudWatch metric namespace
        required: true
        type: string
      os:
        description: Operating system dimension for the completed workflow run
        required: true
        type: string
      role-secret-name:
        description: Repository secret name containing the CloudWatch writer role ARN
        required: true
        type: string
      aws-region:
        description: AWS region for CloudWatch
        required: false
        type: string
        default: us-east-1
    secrets:
      WORKFLOW_SECRETS_READER_ROLE_ARN:
        required: true

permissions:
  id-token: write

jobs:
  emit-metric:
    runs-on: codebuild-agentcore-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 5
    steps:
      - name: Fetch CloudWatch writer role from Secrets Manager
        uses: aws/agentcore-devx-devtools/.github/actions/fetch-secrets@75989f65f7f193deaf83c237c36572d1a8f800b2
        with:
          role-arn: ${{ secrets.WORKFLOW_SECRETS_READER_ROLE_ARN }}
          repo: ${{ inputs['role-secret-name'] }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env[inputs['role-secret-name']] }}
          aws-region: ${{ inputs['aws-region'] }}
          unset-current-credentials: true
      - name: Emit workflow run duration
        env:
          METRIC_NAMESPACE: ${{ inputs.namespace }}
          OS: ${{ inputs.os }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          RUN_COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          duration_seconds=0
          if [[ -n "$RUN_STARTED_AT" ]]; then
            duration_seconds=$(( $(date -d "$RUN_COMPLETED_AT" +%s) - $(date -d "$RUN_STARTED_AT" +%s) ))
          fi
          metric_data=$(jq -nc \
            --arg workflow "$WORKFLOW_NAME" \
            --arg branch "$BRANCH" \
            --arg result "${RESULT:-Unknown}" \
            --arg os "$OS" \
            --arg timestamp "$RUN_COMPLETED_AT" \
            --argjson duration "$duration_seconds" \
            '[{
              MetricName: "WorkflowRunDuration",
              Dimensions: [
                {Name: "WorkflowName", Value: $workflow},
                {Name: "Branch", Value: $branch},
                {Name: "Result", Value: $result},
                {Name: "OS", Value: $os}
              ],
              Timestamp: $timestamp,
              Unit: "Seconds",
              Value: $duration
            }]')
          aws cloudwatch put-metric-data \
            --namespace "$METRIC_NAMESPACE" \
            --metric-data "$metric_data"
