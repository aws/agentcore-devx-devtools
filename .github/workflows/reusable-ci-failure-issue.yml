# Reusable workflow: ci-failure-issue — files a GitHub issue when a caller's CI
# workflow_run completes in failure. Takes zero inputs: the target repo is derived
# from GITHUB_REPOSITORY (set to the caller's repo) by create-failure-issue.ts, the
# script is checked out from the caller, and trigger data is inherited via
# github.event.workflow_run.*.

name: Reusable - CI Failure Issue

# caller-on:
#   workflow_run:
#     workflows:
#     - Build and Test
#     - Quality and Safety Checks
#     - E2E Tests (Full Suite)
#     - CodeQL
#     types:
#     - completed

on:
  workflow_call:
    # No inputs required (see header for how repo-specific values are derived).

jobs:
  create-issue:
    # Keyed on the failing workflow name so concurrent failures of different
    # workflows don't cancel each other, but repeated runs for the same workflow
    # collapse. github.event.workflow_run.* is inherited from the caller's
    # triggering workflow_run event.
    concurrency: ci-failure-issue-${{ github.event.workflow_run.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only act when the upstream CI workflow actually FAILED on the main branch.
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.x'

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create CI failure issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          npx -y tsx .github/scripts/create-failure-issue.ts \
            --title-prefix "CI Failure" \
            --name "$WORKFLOW_NAME" \
            --branch "$HEAD_BRANCH" \
            --commit "$HEAD_SHA" \
            --run-url "$RUN_URL" \
            --labels "high-severity,ci"
